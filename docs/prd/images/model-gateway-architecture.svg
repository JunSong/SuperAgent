<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="100%" role="img">
  <title>SuperAgent 模型网关：一次模型请求的链路</title>
  <desc>CLI 只持单次运行令牌；控制面网关验令牌、限速、换 Key、按模型选路，把请求原样透传给上游，并从流式响应旁路读取 token 用量写入 gateway_call。上游可以是厂商 API、客户自有网关或私有模型。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6f9bff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="350" fill="#12151b"/>
  <g font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="28" fill="#e9edf5" font-size="15" font-weight="500">模型网关：一次模型请求的链路</text>
    <text x="40" y="48" fill="#98a3b6" font-size="12">CLI 只持单次运行令牌；换 Key、选路、计量、限速全部收在控制面</text>

    <rect x="40" y="62" width="120" height="24" rx="6" fill="#1b2029" stroke="#39414f" stroke-width="0.5"/>
    <text x="100" y="74" fill="#98a3b6" font-size="11" text-anchor="middle" dominant-baseline="central">沙箱 / 本机进程</text>
    <rect x="205" y="62" width="285" height="24" rx="6" fill="#16243a" stroke="#6f9bff" stroke-width="0.5"/>
    <text x="347" y="74" fill="#9dbdff" font-size="11" text-anchor="middle" dominant-baseline="central">控制面 · 可信 · superagent-gateway (L3)</text>
    <rect x="535" y="62" width="105" height="24" rx="6" fill="#1b2029" stroke="#39414f" stroke-width="0.5"/>
    <text x="587" y="74" fill="#98a3b6" font-size="11" text-anchor="middle" dominant-baseline="central">外部上游</text>

    <rect x="40" y="100" width="120" height="76" rx="10" fill="#1b2029" stroke="#39414f" stroke-width="0.5"/>
    <text x="100" y="120" fill="#e9edf5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">CLI 进程</text>
    <text x="100" y="140" fill="#98a3b6" font-size="11" text-anchor="middle" dominant-baseline="central">AgentRunner ×11</text>
    <text x="100" y="158" fill="#98a3b6" font-size="11" text-anchor="middle" dominant-baseline="central">只持运行令牌</text>

    <rect x="205" y="100" width="120" height="76" rx="10" fill="#16243a" stroke="#6f9bff" stroke-width="0.5"/>
    <text x="265" y="120" fill="#e9edf5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">网关入口</text>
    <text x="265" y="140" fill="#9dbdff" font-size="11" text-anchor="middle" dominant-baseline="central">验令牌 · 限速</text>
    <text x="265" y="158" fill="#98a3b6" font-size="11" text-anchor="middle" dominant-baseline="central">web · L5</text>

    <rect x="370" y="100" width="120" height="76" rx="10" fill="#16243a" stroke="#6f9bff" stroke-width="0.5"/>
    <text x="430" y="120" fill="#e9edf5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">网关服务</text>
    <text x="430" y="140" fill="#9dbdff" font-size="11" text-anchor="middle" dominant-baseline="central">换 Key · 选路</text>
    <text x="430" y="158" fill="#98a3b6" font-size="11" text-anchor="middle" dominant-baseline="central">透传 · 计量</text>

    <rect x="535" y="100" width="105" height="76" rx="10" fill="#1b2029" stroke="#39414f" stroke-width="0.5"/>
    <text x="587" y="120" fill="#e9edf5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">模型上游</text>
    <text x="587" y="140" fill="#98a3b6" font-size="11" text-anchor="middle" dominant-baseline="central">厂商 / 客户网关</text>
    <text x="587" y="158" fill="#98a3b6" font-size="11" text-anchor="middle" dominant-baseline="central">私有模型</text>

    <path d="M162 138 L203 138" fill="none" stroke="#6f9bff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M327 138 L368 138" fill="none" stroke="#6f9bff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M492 138 L533 138" fill="none" stroke="#6f9bff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="182" cy="112" r="9" fill="#16243a" stroke="#6f9bff" stroke-width="0.5"/>
    <text x="182" y="112" fill="#9dbdff" font-size="11" text-anchor="middle" dominant-baseline="central">1</text>
    <circle cx="347" cy="112" r="9" fill="#16243a" stroke="#6f9bff" stroke-width="0.5"/>
    <text x="347" y="112" fill="#9dbdff" font-size="11" text-anchor="middle" dominant-baseline="central">2</text>
    <circle cx="512" cy="112" r="9" fill="#16243a" stroke="#6f9bff" stroke-width="0.5"/>
    <text x="512" y="112" fill="#9dbdff" font-size="11" text-anchor="middle" dominant-baseline="central">3</text>

    <rect x="40" y="196" width="600" height="134" rx="12" fill="#161a22" stroke="#39414f" stroke-width="0.5"/>
    <text x="58" y="220" fill="#e9edf5" font-size="12" font-weight="500">1　RunCredential 的值从「真 Key + 厂商地址」换成「运行令牌 + 网关地址」，11 个 runner 零改动</text>
    <text x="58" y="243" fill="#e9edf5" font-size="12" font-weight="500">2　令牌绑定公司 / 员工 / 本次运行；验令牌、按公司与员工限速、按模型选上游</text>
    <text x="58" y="266" fill="#e9edf5" font-size="12" font-weight="500">3　换上真 Key 后原样转发；流式响应逐块回传、不缓冲、不改 body；旁路读 usage 写 gateway_call</text>
    <text x="58" y="292" fill="#9dbdff" font-size="11">协议覆盖：Anthropic Messages　·　OpenAI Chat Completions　·　OpenAI Responses（不做协议转换）</text>
    <text x="58" y="313" fill="#98a3b6" font-size="11">开关 superagent.gateway.enabled 默认 false；回滚 = 切回直连，真 Key 重新由 CredentialService 注入</text>
  </g>
</svg>
